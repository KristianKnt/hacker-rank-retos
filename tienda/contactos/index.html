<div class="contact-section">
    <div class="contact-card">
        
        <section class="info-panel">
            <span class="form-subtitle">HABLEMOS</span>
            <h1 class="form-title">Estamos aquí<br>para ayudarte.</h1>
            <p class="form-text">
                ¿Dudas sobre una pieza, tu pedido o simplemente quieres saludar?<br> Nuestro equipo te responderá pronto.
            </p>
            <hr class="form-divider">
            <div class="form-meta">
                <a href="mailto:hola@trendyshop.com" class="form-link">hola@trendyshop.com</a>
                <p class="form-schedule">Lun – Vie, 9:00 a 18:00</p>
            </div>
        </section>

        <section class="form-panel">
            <form class="contact-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">TU NOMBRE</label>
                        <input type="text" id="name" placeholder="María González" required>
                    </div>
                    <div class="form-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" placeholder="maria@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">MENSAJE</label>
                    <textarea id="message" placeholder="¿En qué podemos ayudarte?" rows="4" required></textarea>
                </div>

                <button type="submit" class="form-btn">
                    Enviar mensaje <span class="btn-arrow">&rarr;</span>
                </button>
            </form>
        </section>

    </div>
</div>
