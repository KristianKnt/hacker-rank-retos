<div id="panel-lateral-carrito">
    <!-- Panel Lateral del Carrito -->
    <aside id="panel-carrito" class="panel-carrito">
        <!-- Encabezado -->
        <div class="cabecera-carrito">
            <h2 id="titulo-carrito">Tu selección</h2>
            <p id="subtitulo-carrito">0 productos</p>
            <button type="button" id="boton-cerrar-carrito">X</button>
        </div>

        <!-- Lista dinámica de productos -->
        <div id="cuerpo-carrito" class="cuerpo-carrito"></div>

        <!-- Pie con total y botón de pago -->
        <div id="pie-carrito" class="pie-carrito">
            <span>Total:</span>
            <strong id="precio-total-carrito">$0.00</strong>
            <button class="boton-pagar">Proceder al pago</button>
        </div>
    </aside>
</div>
