<section class="catalogo" id="catalogo">
  <div class="catalogo-contenedor">
    <!-- Encabezado -->
    <header class="catalogo-encabezado">
      <div>
        <span class="catalogo-subtitulo"> NUESTRA COLECCIÓN </span>

        <h2>Encuentra tu pieza</h2>
      </div>

      <p class="catalogo-descripcion">
        Descubre nuestra selección de productos. Encuentra aquello que mejor se
        adapta a tu estilo.
      </p>
    </header>

    <!-- Filtros por categoría -->
    <nav class="catalogo-filtros" aria-label="Categorías de productos">
      <button type="button" class="filtro activo" data-categoria="all">
        Todo
      </button>

      <button type="button" class="filtro" data-categoria="men's clothing">
        Hombre
      </button>

      <button type="button" class="filtro" data-categoria="women's clothing">
        Mujer
      </button>

      <button type="button" class="filtro" data-categoria="jewelery">
        Accesorios
      </button>

      <button type="button" class="filtro" data-categoria="electronics">
        Tecnología
      </button>
    </nav>

    <!-- Contenedor dinámico de productos -->
    <div class="catalogo-productos" id="contenedor-productos"></div>
  </div>
</section>
